services:
  app:
    image: ghcr.io/rassi0429/misskey-markov-chein:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3210:3210"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3210}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
